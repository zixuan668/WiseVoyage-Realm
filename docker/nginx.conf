server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location ^~ /api/v1/ {
        proxy_pass http://base:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Admin SPA paths overlap a few API prefixes. Browser navigations load the
    # SPA, while JSON requests retain the API path and response status.
    location ~ ^/(user|upload|llm|dashboard|digital-guide|scenic-spots|knowledge-base|tour-routes|tour-session|tour-experience|service-stations|analytics|system|files|xingyun|avatar)(/|$) {
        if ($http_accept ~* text/html) { rewrite ^ /index.html last; }
        proxy_pass http://base:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / { try_files $uri $uri/ /index.html; }
}
